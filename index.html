
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b50">
<title>Connexion - IIPEA Connect</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5fa;
 color:#17243a;
 min-height:100vh;
 display:flex;
 flex-direction:column;
}
header{
 background:#102b50;
 color:white;
 padding:22px;
 text-align:center;
}
header h1{margin:0;font-size:26px}
header p{margin:7px 0 0;color:#d6e3f5}
main{
 flex:1;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:25px 16px;
}
.login{
 background:white;
 width:100%;
 max-width:420px;
 padding:30px 24px;
 border-radius:18px;
 box-shadow:0 8px 30px #102b5015;
}
.logo{
 width:65px;
 height:65px;
 margin:0 auto 15px;
 border-radius:18px;
 background:#102b50;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:25px;
 font-weight:bold;
}
h2{text-align:center;margin:0 0 8px;color:#102b50}
.subtitle{text-align:center;color:#718096;font-size:14px;margin-bottom:28px}
label{display:block;font-weight:bold;font-size:14px;margin:17px 0 8px}
input{
 width:100%;
 padding:14px;
 border:1px solid #d5deea;
 border-radius:9px;
 font-size:15px;
 outline:none;
}
input:focus{border-color:#245b94}
button{
 width:100%;
 padding:15px;
 margin-top:24px;
 border:0;
 border-radius:9px;
 background:#102b50;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:hover{background:#1b4677}
.help{text-align:center;margin-top:20px;font-size:13px;color:#53657b}
footer{text-align:center;padding:20px;color:#718096;font-size:12px}
#message{font-size:13px;text-align:center;margin-top:15px;color:#b45309}
</style>
</head>
<body>
<header>
<h1>IIPEA Connect</h1>
<p>Votre espace numérique étudiant</p>
</header>

<main>
<div class="login">
<div class="logo">I</div>
<h2>Bienvenue !</h2>
<p class="subtitle">Connectez-vous à votre espace étudiant</p>

<form id="loginForm">
<label for="email">Adresse e-mail</label>
<input type="email" id="email" placeholder="exemple@email.com" required>

<label for="password">Mot de passe</label>
<input type="password" id="password" placeholder="Votre mot de passe" required>

<button type="submit">Se connecter</button>
<p id="message"></p>
</form>

<p class="help">Besoin d'aide ? Contactez l'administration de votre établissement.</p>
</div>
</main>

<footer>
IIPEA Connect · Espace étudiant
</footer>

<script>
document.getElementById("loginForm").addEventListener("submit",function(event){
 event.preventDefault();
 document.getElementById("message").textContent =
 "La connexion sera disponible après la configuration du système sécurisé.";
});
</script>
</body>
</html>
