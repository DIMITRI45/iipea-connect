
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIPEA Connect</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102b50, #176b87);
    }
    .card {
      width: 100%; max-width: 410px; background: white;
      padding: 28px; border-radius: 18px;
      box-shadow: 0 12px 35px #0003;
    }
    h1, h2 { color: #12345a; text-align: center; }
    p { color: #64748b; text-align: center; }
    input, button {
      width: 100%; padding: 14px; margin-top: 12px;
      border-radius: 9px; font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0; background: #145b83; color: white;
      font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #e8eef4; color: #12345a; }
    .link {
      display: block; margin-top: 16px; text-align: center;
      color: #145b83; cursor: pointer; text-decoration: underline;
    }
    #message { font-size: 14px; margin-top: 15px; }
    #dashboard, #resetSection, #forgotSection { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>IIPEA Connect</h1>
    <p>Votre espace étudiant</p>

    <section id="auth">
      <input id="name" placeholder="Nom complet (inscription)">
      <input id="email" type="email" placeholder="Adresse e-mail">
      <input id="password" type="password" placeholder="Mot de passe">

      <button id="signup">Créer un compte</button>
      <button id="login" class="secondary">Se connecter</button>

      <span class="link" id="forgotLink">Mot de passe oublié ?</span>
    </section>

    <section id="forgotSection">
      <h2>Récupération du compte</h2>
      <p>Entre ton adresse e-mail pour recevoir un lien de réinitialisation.</p>
      <input id="forgotEmail" type="email" placeholder="Adresse e-mail">
      <button id="sendReset">Envoyer le lien</button>
      <span class="link" id="backLogin">Retour à la connexion</span>
    </section>

    <section id="resetSection">
      <h2>Nouveau mot de passe</h2>
      <p>Choisis ton nouveau mot de passe.</p>
      <input id="newPassword" type="password" placeholder="Nouveau mot de passe">
      <input id="confirmPassword" type="password" placeholder="Confirmer le mot de passe">
      <button id="savePassword">Enregistrer le nouveau mot de passe</button>
    </section>

    <section id="dashboard">
      <h2>Bienvenue !</h2>
      <p id="welcome"></p>
      <button id="logout">Se déconnecter</button>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script>
    const SUPABASE_URL = "https://zjsivbfnunbefscxbgdq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MoPsfEdKwe1KbsLW--Ldug__IUFh6UN";

    const client = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const message = document.getElementById("message");

    function showSection(sectionId) {
      ["auth", "forgotSection", "resetSection", "dashboard"]
        .forEach(id => {
          document.getElementById(id).style.display =
            id === sectionId ? "block" : "none";
        });
      message.textContent = "";
    }

    async function showUser(user) {
      showSection("dashboard");

      const { data, error } = await client
        .from("profiles")
        .upsert({
          id: user.id,
          full_name: user.user_metadata?.full_name || null
        })
        .select("full_name")
        .single();

      document.getElementById("welcome").textContent =
        "Bienvenue " + (data?.full_name || user.email);
    }

    document.getElementById("signup").onclick = async () => {
      const fullName = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!fullName || !email || password.length < 8) {
        message.textContent =
          "Remplis tous les champs. Mot de passe : 8 caractères minimum.";
        return;
      }

      message.textContent = "Création du compte...";

      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName },
          emailRedirectTo: window.location.origin
        }
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      if (data.session) {
        await showUser(data.user);
      } else {
        message.textContent =
          "Compte créé ! Consulte ton e-mail pour confirmer ton inscription.";
      }
    };

    document.getElementById("login").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Connexion...";

      const { data, error } = await client.auth.signInWithPassword({
        email, password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      await showUser(data.user);
    };

    document.getElementById("forgotLink").onclick = () => {
      document.getElementById("forgotEmail").value =
        document.getElementById("email").value.trim();
      showSection("forgotSection");
    };

    document.getElementById("backLogin").onclick = () => {
      showSection("auth");
    };

    document.getElementById("sendReset").onclick = async () => {
      const email = document.getElementById("forgotEmail").value.trim();

      if (!email) {
        message.textContent = "Entre ton adresse e-mail.";
        return;
      }

      message.textContent = "Envoi en cours...";

      const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      });

      message.textContent = error
        ? error.message
        : "Si cette adresse correspond à un compte, un lien de réinitialisation sera envoyé. Vérifie ta boîte mail.";
    };

    document.getElementById("savePassword").onclick = async () => {
      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "Le mot de passe doit contenir au moins 8 caractères.";
        return;
      }

      if (password !== confirmation) {
        message.textContent = "Les deux mots de passe ne correspondent pas.";
        return;
      }

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Mot de passe modifié avec succès !";
      showSection("auth");
    };

    document.getElementById("logout").onclick = async () => {
      const { error } = await client.auth.signOut();

      if (error) {
        message.textContent = error.message;
        return;
      }

      showSection("auth");
      message.textContent = "Déconnexion réussie.";
    };

    client.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        showSection("resetSection");
      } else if (event === "SIGNED_IN" && session) {
        showUser(session.user);
      } else if (event === "SIGNED_OUT") {
        showSection("auth");
      } else if (event === "INITIAL_SESSION" && session) {
        showUser(session.user);
      }
    });
  </script>
</body>
</html>
