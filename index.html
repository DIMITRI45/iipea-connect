<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIPEA Connect</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102b50, #176b87);
    }
    .card {
      width: 100%; max-width: 410px; background: white;
      padding: 28px; border-radius: 18px;
      box-shadow: 0 12px 35px #0003;
    }
    h1 { color: #12345a; text-align: center; }
    p { color: #64748b; text-align: center; }
    input, button {
      width: 100%; padding: 14px; margin-top: 12px;
      border-radius: 9px; font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0; background: #145b83; color: white;
      font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #e8eef4; color: #12345a; }
    #message { font-size: 14px; margin-top: 15px; }
    #dashboard { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>IIPEA Connect</h1>
    <p>Votre espace étudiant</p>

    <section id="auth">
      <input id="name" placeholder="Nom complet (inscription)">
      <input id="email" type="email" placeholder="Adresse e-mail">
      <input id="password" type="password" placeholder="Mot de passe">

      <button id="signup">Créer un compte</button>
      <button id="login" class="secondary">Se connecter</button>
      <p id="message"></p>
    </section>

    <section id="dashboard">
      <h2>Bienvenue !</h2>
      <p id="welcome"></p>
      <button id="logout">Se déconnecter</button>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://zjsivbfnunbefscxbgdq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MoPsfEdKwe1KbsLW--Ldug__IUFh6UN";

    const client = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const message = document.getElementById("message");

    async function showUser(user) {
      document.getElementById("auth").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

      const { data } = await client
        .from("profiles")
        .select("full_name")
        .eq("id", user.id)
        .maybeSingle();

      document.getElementById("welcome").textContent =
        "Bienvenue " + (data?.full_name || user.email);
    }

    document.getElementById("signup").onclick = async () => {
      const fullName = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!fullName || !email || password.length < 8) {
        message.textContent = "Remplissez tous les champs. Mot de passe : 8 caractères minimum.";
        return;
      }

      message.textContent = "Création du compte...";

      const { data, error } = await client.auth.signUp({
        email, password,
        options: {
          data: { full_name: fullName },
          emailRedirectTo: "https://iipea-connect.vercel.app"
        }
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      if (data.user && data.session) {
        const { error: profileError } = await client
          .from("profiles")
          .upsert({ id: data.user.id, full_name: fullName });

        if (profileError) {
          message.textContent = "Compte créé, mais profil non enregistré : " + profileError.message;
          return;
        }
        await showUser(data.user);
      } else {
        message.textContent = "Compte créé ! Consultez votre e-mail pour confirmer votre inscription.";
      }
    };

    document.getElementById("login").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Connexion...";
      const { data, error } = await client.auth.signInWithPassword({
        email, password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }
      await showUser(data.user);
    };

    document.getElementById("logout").onclick = async () => {
      await client.auth.signOut();
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("auth").style.display = "block";
      message.textContent = "Déconnexion réussie.";
    };

    client.auth.getSession().then(({ data }) => {
      if (data.session) showUser(data.session.user);
    });
  </script>
</body>
</html>
